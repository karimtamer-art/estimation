name: estimation
description: Estimation Calculator — Pocket/Egyptian (تقدير) scorekeeper.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1
  shared_preferences: ^2.2.2
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    # The crown and the koz, worn by whoever is out front and whoever is dead
    # last. Everything else the app draws itself; these two are pictures on
    # purpose — they are the trophy and the punishment.
    - assets/crown.png
    - assets/koz.png
    - assets/clown.png
    # The nine faces a seat can wear, ids 0-8 in file order.
    - assets/avatars/
