# Codemagic CI for the Estimation scorekeeper.
#
# NOTE: this repo does not version the generated platform folders (see
# .gitignore). A fresh clone has no ios/, android/ or web/ — every workflow
# must run `flutter create .` before building or it fails immediately.

definitions:
  # `stable` means the version already installed on the build image, so the
  # machine starts running scripts immediately. Pinning an exact version that
  # the image does not carry makes Codemagic download and install the whole
  # SDK first, before the first line of any script — which is why this build
  # used to sit there doing nothing far longer than padel-app, despite padel
  # being much the bigger app.
  #
  # The cost is that a Flutter release can now change under the build. If one
  # ever breaks it, pin the exact version again here — but pin one the image
  # actually ships, or the wait comes straight back.
  flutter_version: &flutter_version stable

  regenerate: &regenerate
    name: Regenerate platform folders
    script: |
      # Not in git — see the note at the top of this file.
      flutter create . --project-name estimation --org "$ORG_ID" --platforms "$PLATFORMS"
      # `flutter create` also re-adds its counter template test, which refers to
      # a MyApp class this app does not have. Left in place it fails analyze
      # and test on every clean checkout.
      rm -f test/widget_test.dart
      flutter pub get

      # flutter create writes the template's Flutter-blue icons over every
      # platform folder; paint the app's own back on. See design/README.md.
      bash tool/apply_branding.sh

      # --- patches to generated iOS files -------------------------------
      # ios/ is recreated every build, so these cannot live in git.
      if [ -f ios/Runner.xcodeproj/project.pbxproj ]; then
        # ITMS-90068: Flutter templates iOS 13.0, but Apple requires a
        # MinimumOSVersion of 15.0+ from Spring 2027. MinimumOSVersion is
        # derived from this setting; AppFrameworkInfo.plist no longer holds it.
        # Written via a temp file because BSD sed (macOS) and GNU sed disagree
        # about -i.
        PBX=ios/Runner.xcodeproj/project.pbxproj
        sed 's/IPHONEOS_DEPLOYMENT_TARGET = 13\.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' \
          "$PBX" > "$PBX.tmp" && mv "$PBX.tmp" "$PBX"
        echo "deployment targets now:"
        grep -o "IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;" "$PBX" | sort | uniq -c

        # Answer the export-compliance question once, in the binary, instead of
        # by hand in App Store Connect after every upload. This app is offline
        # and uses no encryption.
        /usr/libexec/PlistBuddy -c \
          "Add :ITSAppUsesNonExemptEncryption bool false" ios/Runner/Info.plist \
          2>/dev/null || \
        /usr/libexec/PlistBuddy -c \
          "Set :ITSAppUsesNonExemptEncryption false" ios/Runner/Info.plist
      fi

  test: &test
    name: Analyze and test
    script: |
      flutter analyze --no-fatal-infos
      flutter test

workflows:
  # ---------------------------------------------------------------- iOS
  ios-testflight:
    name: iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    # Nothing here was cached before, so every build re-downloaded the whole
    # pub cache and the CocoaPods setup before it could start. These are the
    # download directories only — never build output, which is worthless
    # across machines and only slows the cache restore down.
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    integrations:
      # Codemagic UI → Teams → Integrations → Apple Developer Portal.
      # The name here must match the key you added there exactly.
      app_store_connect: AppStoreConnect

    environment:
      groups:
        # Must contain the secure var CERTIFICATE_PRIVATE_KEY — the same group
        # the padel-app build uses. Without that key, fetch-signing-files
        # --create mints no certificate and the archive step dies with
        # "No valid code signing certificates were found".
        - appstore
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.calculator.estimation"
        ORG_ID: "com.calculator"
        PLATFORMS: "ios"
      # No `ios_signing:` block on purpose. That is Codemagic's automatic
      # signing, which only *looks up* profiles and fails with "No matching
      # profiles found" when none exists yet. The script below creates them.

    scripts:
      - *regenerate
      - *test

      - name: Prepare iOS toolchain
        script: |
          set -e
          flutter precache --ios
          # No `pod install` here. `flutter create` does not emit ios/Podfile —
          # it is generated on demand by `flutter build ipa`, which then runs
          # pod install itself. Calling pod install first dies with
          # "No `Podfile' found in the project directory."
          # (padel-app differs: it commits ios/ and drives xcodebuild directly.)

      - name: Set up code signing
        script: |
          set -e   # fail fast: without this a later success (use-profiles)
                   # masks a fetch-signing-files failure, and the build only
                   # dies much later at the archive step.
          keychain initialize

          # CERTIFICATE_PRIVATE_KEY is stored as single-line base64 because the
          # Codemagic UI truncates a raw multi-line PEM, which yields an invalid
          # key and 0 signing identities. Decode it back and pass it by file.
          printf '%s' "$CERTIFICATE_PRIVATE_KEY" \
            | openssl base64 -d -A > /tmp/cert_key.pem
          echo "decoded key first line: $(head -1 /tmp/cert_key.pem)"

          # --create mints the distribution certificate FROM THIS KEY plus the
          # App Store profile if missing, and reuses them on later builds.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          keychain add-certificates

          # Must list at least one identity; empty here means signing will fail.
          security find-identity -v -p codesigning
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          set -e
          # App Store Connect rejects a build number it has already seen, so
          # never ship the +1 hard-coded in pubspec.yaml.
          #
          # BUILD_LABEL is printed on the app's home screen. Every build calls
          # itself 1.0.0, so without it there is no way to tell a fresh
          # TestFlight install from the copy already on the phone.
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=BUILD_LABEL="$BUILD_NUMBER-$(git rev-parse --short HEAD)" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # false = upload only. INTERNAL testers get the build automatically once
        # it finishes processing, with no review. `true` submits for EXTERNAL
        # TestFlight beta review, which demands a feedback email and reviewer
        # contact details we do not need for internal testing.
        submit_to_testflight: false
        # No beta_groups here on purpose: naming a group that does not already
        # exist in TestFlight fails the publish step. Create the group in
        # TestFlight first, then add it back to auto-distribute:
        #   beta_groups:
        #     - Internal Testers

      email:
        recipients:
          - karimtamer237@gmail.com
        notify:
          success: true
          failure: true

  # ------------------------------------------------------------ Android
  android:
    name: Android · APK
    instance_type: linux_x2
    max_build_duration: 30

    # Gradle is the expensive one here: without this its distribution and
    # every dependency come down again on each build.
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches

    environment:
      flutter: *flutter_version
      vars:
        ORG_ID: "com.calculator"
        PLATFORMS: "android"

    scripts:
      - *regenerate
      - *test
      - name: Build APK
        script: |
          flutter build apk --release --build-number="$BUILD_NUMBER" \
            --dart-define=BUILD_LABEL="$BUILD_NUMBER-$(git rev-parse --short HEAD)"

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  # ---------------------------------------------------------------- Web
  web:
    name: Web
    instance_type: linux_x2
    max_build_duration: 20

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $FLUTTER_ROOT/.pub-cache

    environment:
      flutter: *flutter_version
      vars:
        ORG_ID: "com.calculator"
        PLATFORMS: "web"

    scripts:
      - *regenerate
      - *test
      - name: Build web
        script: |
          flutter build web --release \
            --dart-define=BUILD_LABEL="cm-$BUILD_NUMBER-$(git rev-parse --short HEAD)"

    artifacts:
      - build/web/**
